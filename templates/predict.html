<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Disease</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="bg-blur-container">
        <div class="container">
            <h1 class="main-title">Animal Disease Diagnosis</h1>
            <p class="subtitle">Enter details about your livestock</p>
            
            <form action="/result" method="post">
                <div class="form-group">
                    <label><span class="icon">🐾</span> Animal Type</label>
                    <input type="text" name="animal_type" placeholder="e.g. Goat, Cow" required>
                </div>

                <div class="form-group">
                    <label><span class="icon">📅</span> Age</label>
                    <input type="number" name="age" placeholder="Enter age" required>
                </div>

                <div class="form-group">
                    <label><span class="icon">🌡️</span> Temperature (°F)</label>
                    <input type="number" step="0.1" name="temperature" placeholder="e.g. 100.3" required>
                </div>

                <div class="form-group">
                    <label><span class="icon">🩺</span> Primary Symptom</label>
                    <input type="text" name="sym1" placeholder="e.g. chills" required>
                </div>

                <div class="form-group">
                    <label><span class="icon">🩺</span> Secondary Symptom (optional)</label>
                    <input type="text" name="sym2" placeholder="e.g. swelling in extremities">
                </div>

                <div class="form-group">
                    <label><span class="icon">🩺</span> Additional Symptom (optional)</label>
                    <input type="text" name="sym3" placeholder="e.g. shortness of breath">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Predict</button>
            </form>
        </div>
    </div>
</body>
</html>
